name: Electron and TypeScript
on:
  pull_request:
    branches: [dev, main, 'feat/**']
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  typescript:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies without install hooks
        run: npm ci --ignore-scripts
      - name: Build SQLite binding from locked source
        run: npm run native:sqlite:build
      - name: Build Windows Job Object supervisor from locked source
        if: runner.os == 'Windows'
        run: npm run native:supervisor:build
      - name: Build workspace package entrypoints for security integration tests
        run: npm run typecheck
      - name: Test native supervisor argument contract
        run: npm run native:supervisor:contract
      - name: Test worker API security boundaries
        run: npm run test:worker-api-security
      - name: Test worker trust, pairing and audit boundaries
        run: npm run test:worker-trust-security
      - name: Test Windows supervisor and AppContainer as a standard user
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File scripts/windows/ci-supervisor-check.ps1 -RepoRoot (Get-Location).Path
      - name: Test Windows service installer policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          Invoke-Pester -Path scripts/windows/tests/worker-service-install.Tests.ps1 -CI
      - name: Verify application workspace, desktop build, tests and dependency audits
        run: npm run verify
      - name: Build Windows SCM host and stage the worker-service payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S native/worker-supervisor -B build/worker-supervisor
          cmake --build build/worker-supervisor --config Release --target sumatrafuzz_worker_service_host
          $nodeRuntime = (Get-Command node).Source
          node scripts/stage-worker-service.mjs `
            --node $nodeRuntime `
            --host (Resolve-Path build/worker-supervisor/Release/SumatraFuzzWorkerHost.exe).Path `
            --public-key apps/desktop/resources/worker-bundle-signing-key.pem `
            --output release/worker-service/SumatraFuzz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: sumatrafuzz-windows-x64-worker-service
          path: release/worker-service/SumatraFuzz
          if-no-files-found: error
          retention-days: 14
  desktop-installer:
    name: Electron Windows x64 NSIS installer
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Download the exact Electron runtime without running package hooks
        run: node node_modules/electron/install.js
      - name: Build unsigned x64 NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:package:win
      - name: Test package policy against the built ASAR
        run: node scripts/check-desktop-package.mjs release/windows/win-unpacked/resources/app.asar
      - name: Generate lockfile-based CycloneDX SBOM
        run: npm exec -- cyclonedx-npm --package-lock-only --output-file sumatrafuzz.cdx.json
      - name: Silently install, launch and uninstall
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release/windows -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          $installDir = Join-Path $env:RUNNER_TEMP 'SumatraFuzz Installer Smoke'
          $install = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS install failed with exit code $($install.ExitCode)" }
          $application = Join-Path $installDir 'SumatraFuzz.exe'
          if (-not (Test-Path -LiteralPath $application -PathType Leaf)) { throw 'Installed desktop executable is missing' }
          $process = Start-Process -FilePath $application -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "Desktop exited during smoke launch with code $($process.ExitCode)" }
          & taskkill.exe /T /F /PID $process.Id | Out-Null
          $uninstaller = Join-Path $installDir 'Uninstall SumatraFuzz.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw 'NSIS uninstaller is missing' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstall failed with exit code $($uninstall.ExitCode)" }
          if (Test-Path -LiteralPath $application) { throw 'Desktop executable remains after uninstall' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sumatrafuzz-windows-x64-nsis
          path: release/windows/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sumatrafuzz-cyclonedx-sbom
          path: sumatrafuzz.cdx.json
          if-no-files-found: error
          retention-days: 14
