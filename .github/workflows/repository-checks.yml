name: Repository checks
on:
  pull_request:
    branches: [dev, main, 'feat/**']
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target-config:
    name: Target config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source pin
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('configs/targets/sumatrapdf-3.6.1rel.json')
          x = json.loads(p.read_text())
          assert x['source_tag'] == '3.6.1rel'
          assert x['source_commit'] == '16c59fde8b824ab54c56f23aef910a6fdd874ad0'
          assert x['architecture'] == 'x64'
          assert x['harness_entry'] == 'fuzz_one_file'
          assert x['nargs'] == 1
          assert x['coverage_modules'] == []
          print('Source pin metadata PASS; runtime verification NOT RUN')
          PY
  windows-tests:
    name: Windows Pester
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
      - name: Validate Windows toolchain code
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          Invoke-Pester -Path scripts/windows/tests -CI
      - name: Parse all Windows PowerShell scripts before expensive builds
        shell: pwsh
        run: |
          $paths = @(Get-ChildItem -Path scripts/windows -Filter '*.ps1' -Recurse -File)
          if ($paths.Count -lt 3) { throw 'Expected native Windows verification scripts not found' }
          foreach ($file in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell script fails parser validation: $($file.FullName)"
            }
            Write-Output "PowerShell parse OK: $($file.FullName)"
          }
  native-contract:
    name: Native C++ contract
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows x64 harness contract
        shell: pwsh
        run: cmake -S native/sumatra-harness -B build/a2 -A x64 -DSUMATRAFUZZ_REAL_ENGINE=OFF
      - name: Build contract tests
        shell: pwsh
        run: cmake --build build/a2 --config Debug
      - name: Execute contract tests
        shell: pwsh
        run: ctest --test-dir build/a2 -C Debug --output-on-failure
  native-real-engine:
    name: Real SumatraPDF parser
    runs-on: windows-2022
    needs: [target-config, windows-tests, native-contract, debug-evidence-unit]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned SumatraPDF 3.6.1rel source
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.6.1rel https://github.com/sumatrapdfreader/sumatrapdf.git external/sumatrapdf
          if ($LASTEXITCODE -ne 0) { throw 'Upstream clone failed' }
          $sha = (& git -C external/sumatrapdf rev-parse HEAD).Trim()
          if ($sha -ne '16c59fde8b824ab54c56f23aef910a6fdd874ad0') { throw "Wrong source commit: $sha" }
      - name: Build genuine PDF filter and run real engine tests
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild unavailable' }
          pwsh -File scripts/windows/build-harness.ps1 -SumatraSource (Resolve-Path external/sumatrapdf).Path -MSBuildPath $msbuild -Configuration Release
      - name: Publish verified pinned SumatraPDF artifacts for instrumentation
        uses: actions/upload-artifact@v4
        with:
          name: verified-a3-native-${{ github.run_id }}
          path: |
            build/a3/Release/sumatrafuzz-harness.exe
            build/a3/Release/PdfFilter.dll
            build/a3/Release/libmupdf.dll
          if-no-files-found: error
          retention-days: 30
  debug-evidence-unit:
    name: DynamoRIO debug evidence parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject incomplete fake, crashed and empty instrumentation records
        run: python3 -m unittest discover -s tools/instrumentation/tests -v
      - name: Verify actual WinAFL stats parser and deterministic seed generator
        run: python3 -m unittest discover -s tools/evidence/tests -v
      - name: Verify preserved deterministic PDF fixture tests
        run: python3 -m unittest discover -s scripts/windows/tests -p 'test_*.py' -v
  real-dynamorio:
    name: DynamoRIO persistent debug
    runs-on: windows-2022
    needs: [windows-tests, debug-evidence-unit, native-real-engine]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned SumatraPDF 3.6.1rel
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.6.1rel https://github.com/sumatrapdfreader/sumatrapdf.git external/sumatrapdf
          if ($LASTEXITCODE -ne 0) { throw 'Pinned upstream clone failed' }
          $sha = (& git -C external/sumatrapdf rev-parse HEAD).Trim()
          if ($sha -ne '16c59fde8b824ab54c56f23aef910a6fdd874ad0') { throw 'Pinned Sumatra source drift' }
      - name: Load genuine CTest-verified pinned SumatraPDF binaries
        uses: actions/download-artifact@v4
        with:
          name: verified-a3-native-${{ github.run_id }}
          path: build/a3/Release
      - name: Assert intact parser artifacts before instrumenting
        shell: pwsh
        run: |
          foreach ($name in @('sumatrafuzz-harness.exe','PdfFilter.dll','libmupdf.dll')) {
            $path = Join-Path (Get-Location) "build/a3/Release/$name"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing real artifact: $path" }
            Write-Output "$name SHA256=$((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash)"
          }
      - name: Provision pinned source-built WinAFL and DynamoRIO
        shell: pwsh
        run: |
          pwsh -File scripts/windows/provision-winafl.ps1 -Workspace (Join-Path (Get-Location) 'external/native-tools') -SumatraSource (Resolve-Path external/sumatrapdf).Path
      - name: Genuine 10-cycle DynamoRIO debug with actual edge feedback
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          $seed = Join-Path $repo 'runs/a4/seed.pdf'
          python tools/instrumentation/make_debug_seed.py --out $seed
          if ($LASTEXITCODE -ne 0) { throw 'Seed generation failed' }
          pwsh -File scripts/windows/run-dynamorio-debug.ps1 `
            -ToolchainLock (Join-Path $repo 'external/native-tools/locks/target-lock.json') `
            -HarnessExe (Join-Path $repo 'build/a3/Release/sumatrafuzz-harness.exe') `
            -InputPdf $seed -OutputDir (Join-Path $repo 'runs/a4/debug-evidence')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a4-genuine-dynamorio-debug-${{ github.run_id }}
          path: runs/a4/debug-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Generate and verify genuine PDF seeds
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          $seeds = Join-Path $repo 'runs/a5/seeds'
          python scripts/windows/generate_fixtures.py --out $seeds
          if ($LASTEXITCODE -ne 0) { throw 'Deterministic PDF seed generation failed' }
          $harness = Join-Path $repo 'build/a3/Release/sumatrafuzz-harness.exe'
          foreach ($file in @(Get-ChildItem -LiteralPath $seeds -Filter '*.pdf' -File)) {
            & $harness $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Pinned SumatraPDF parser rejected a seed: $($file.Name)" }
          }
      - name: Genuine bounded WinAFL reference run
        shell: pwsh
        timeout-minutes: 15
        run: |
          $repo = (Get-Location).Path
          pwsh -File scripts/windows/run-winafl-smoke.ps1 `
            -ToolchainLock (Join-Path $repo 'external/native-tools/locks/target-lock.json') `
            -A4Manifest (Join-Path $repo 'runs/a4/debug-evidence/a4-confirmed.json') `
            -HarnessExe (Join-Path $repo 'build/a3/Release/sumatrafuzz-harness.exe') `
            -InputDir (Join-Path $repo 'runs/a5/seeds') `
            -OutputDir (Join-Path $repo 'runs/a5/campaign') `
            -DurationSeconds 720 -TimeoutMs 20000 -FuzzIterations 1000
      - name: Collect A6 verified native evidence
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          python tools/evidence/collect.py `
            --toolchain-lock (Join-Path $repo 'external/native-tools/locks/target-lock.json') `
            --a4-manifest (Join-Path $repo 'runs/a4/debug-evidence/a4-confirmed.json') `
            --harness (Join-Path $repo 'build/a3/Release/sumatrafuzz-harness.exe') `
            --run-dir (Join-Path $repo 'runs/a5/campaign') `
            --before-stats (Join-Path $repo 'runs/a5/campaign/first.stats') `
            --after-stats (Join-Path $repo 'runs/a5/campaign/second.stats') `
            --output (Join-Path $repo 'runs/a6/evidence.json')
          if ($LASTEXITCODE -ne 0) { throw 'A6 cryptographic evidence verification failed' }
      - name: Upload verified A6 manifest (no crash or queue inputs)
        uses: actions/upload-artifact@v4
        with:
          name: a6-verified-summary-${{ github.run_id }}
          path: runs/a6/evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Save non-sensitive WinAFL counters and run metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5-winafl-counters-${{ github.run_id }}
          path: |
            runs/a5/campaign/fuzzer_stats
            runs/a5/campaign/campaign-metadata.json
            runs/a5/campaign/first.stats
            runs/a5/campaign/second.stats
            external/native-tools/locks/target-lock.json
          if-no-files-found: warn
          retention-days: 30
